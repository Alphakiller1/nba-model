name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests scripts
      - name: pytest
        # Offline by design: ESPN fixtures live in tests/fixtures.
        run: python -m pytest -q
      - name: authority smoke
        run: |
          python - <<'EOF'
          from nbamodel import authority, ratings
          assert authority.LEVEL == 'RESEARCH_ONLY'
          assert 'live_clv' in authority.UNMET_GATES
          c = ratings.CONSTANTS
          # Every fitted term must carry the sign basketball says it should.
          assert c.home_eff > 0 and c.b2b_off < 0 and c.b2b_def > 0
          print('authority smoke OK', authority.UNMET_GATES)
          EOF
      - name: live board builds
        # This step DOES hit ESPN: a broken source is a real deploy failure and
        # CI should find it before Pages does. A degraded build fails here too.
        run: |
          python -m nbamodel.cli build --out _smoke
          python - <<'PY'
          import json
          b = json.load(open('_smoke/build.json'))
          assert b['state'] == 'ok', b['issues']
          assert b['cached_games'] >= 0
          from nbamodel import ingest
          assert len(ingest.load_games(b['season'] - 1)) > 1000, 'history not found under data/'
          print('build ok', b)
          PY
