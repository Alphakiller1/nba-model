[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nba-model"
version = "0.2.0"
description = "NBA player-impact model (Bayesian RAPM on lineup stints) with early-line signals and an authority gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.15.20"]

[project.scripts]
nba-model = "nbamodel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nbamodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

# Selected explicitly, matching nfl-model and wnba-edge-model: ruff's default set
# grows with each release and would turn CI red on a day nobody touched the code.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The dashboard is one HTML template; wrapping its markup to 120 columns
# would only make the page harder to read against its output.
"src/nbamodel/site.py" = ["E501"]
